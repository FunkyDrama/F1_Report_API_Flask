{% extends "base.html" %}

{%block title%}{{ info.name }} — Driver Report{% endblock title%}

{% block content %}
<body>
<span><a href="{{ url_for('report_drivers') }}">← Drivers</a></span>
<h1>{{ info.name }}</h1>
<ul>
    <li><strong>Abbreviation:</strong> {{ abbr }}</li>
    <li><strong>Team:</strong> {{ info.team }}</li>
    <li><strong>Time:</strong> {{ info.time }}</li>
</ul>
</body>
{% endblock content %}
